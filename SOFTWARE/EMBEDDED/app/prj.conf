CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_LBS"

CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_LOG=y

# Enable the LBS service
CONFIG_BT_LBS=y
CONFIG_BT_LBS_POLL_BUTTON=y
CONFIG_DK_LIBRARY=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- OPTIMISATION STABILITÉ BLE ---

# 1. Augmenter les buffers de transmission (TX)
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_CONN_TX_MAX=10

# 2. Augmenter la taille des paquets côté Host
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# 3. Paramètres de connexion préférés (Plus tolérants pour Android)
# Intervalle min : ~30ms
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
# Intervalle max : ~50ms
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
# Timeout de supervision : 4 secondes
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400